name: 1-Hour Auto Idea Push

on:
  schedule:
    # 매 1시간마다 정각에 실행
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub 웹에서 수동 [Run workflow] 테스트 가능

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 아이디어 생성 및 푸시 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: "the-forest-camp-alert"
          BASE_URL: "https://app-idea-cyan-chi.vercel.app"
        run: python auto_push.py
